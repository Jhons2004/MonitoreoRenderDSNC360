<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSNC 360 | Monitor</title><style>body{font:16px system-ui;background:#101722;color:#e5edf8;margin:0;padding:24px}main{max-width:1200px;margin:auto}h1{margin-bottom:4px}p{color:#aab9ce}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}article{background:#1b2738;border:1px solid #34445a;padding:20px;border-radius:12px}li{margin:10px 0;overflow-wrap:anywhere}small{color:#aab9ce}button{background:#2863aa;color:white;border:0;padding:12px;border-radius:7px;cursor:pointer}.ok{color:#6ee7b7}.warn{color:#fbbf24}</style><main><h1>RENDER ORCHESTRATOR</h1><p>DSNC 360 · Monitor de infraestructura</p><p id="stamp" role="status">Consultando...</p><button id="refresh">Actualizar vista</button><h2>Render</h2><section class="grid" id="Render"></section><h2>Neon PostgreSQL</h2><section class="grid" id="Neon"></section><p>Los datos no disponibles no se interpretan como cero. El tiempo activo no equivale a CU-horas ni a porcentaje de cuota. Sin migraciones automáticas.</p></main><script>const el=(tag,text)=>{const e=document.createElement(tag);e.textContent=text;return e};async function refresh(){try{const r=await fetch('/api/monitor',{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();document.getElementById('stamp').textContent=data.collected_at?'Última consulta: '+new Date(data.collected_at).toLocaleString('es-GT',{timeZone:'America/Guatemala'}):'Esperando primera consulta';for(const p of ['Render','Neon'])document.getElementById(p).replaceChildren();for(const a of data.accounts){const card=el('article','');card.append(el('h3',a.provider+' '+String(a.account).padStart(2,'0')));const state=el('p',({connected:'Conectado',not_configured:'Credenciales pendientes',error:'Error de consulta'})[a.status]||a.status);state.className=a.status==='connected'?'ok':'warn';card.append(state);const list=el('ul','');for(const s of a.resources){let details=a.provider==='Render'?(s.state||'Estado desconocido')+' · '+(s.reason||[]).join(', '):'Tiempo activo: '+(s.active_seconds==null?'N/D':(s.active_seconds/3600).toFixed(2)+' h')+' · Cómputo: '+(s.compute_seconds??'N/D')+' s · Transferencia: '+(s.transfer_bytes??'N/D')+' bytes · Reinicio: '+(s.reset_at??'N/D');list.append(el('li',s.name+' — '+details))}card.append(list);document.getElementById(a.provider).append(card)}}catch(e){document.getElementById('stamp').textContent='No se pudo actualizar; comprueba la conexión.'}}document.getElementById('refresh').onclick=refresh;refresh();setInterval(refresh,60000)</script></html>
